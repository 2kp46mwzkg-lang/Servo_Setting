<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réglages Servo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout : barre-plaque signalétique en tête, onglets, puis configurateur deux colonnes (saisie | résultats) */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#D3DAE1; --line-strong:#B9C3CC;
  --fg:#15202A; --muted:#5A6774; --accent:#1D5A8E; --accent-fg:#FFFFFF; --accent-soft:#DFEAF5;
  --ok:#2C7A4C; --ok-soft:#E1F1E7; --warn:#9C5D0E; --warn-soft:#FBEFD9; --crit:#B3261E; --crit-soft:#FBE3E1;
  --seg-m:#1D5A8E; --seg-g:#7A93AB; --seg-l:#D08A2E;
  --plate:#1B2632; --plate-fg:#E8EDF2; --plate-muted:#9AAAB9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface-2:#1B252F; --line:#2A3642; --line-strong:#3A4856;
  --fg:#E2E8EE; --muted:#93A1AE; --accent:#6EA6DA; --accent-fg:#0E141A; --accent-soft:#1A2E42;
  --ok:#5DBB85; --ok-soft:#163024; --warn:#E3A84E; --warn-soft:#33260F; --crit:#F0756B; --crit-soft:#3A1816;
  --seg-m:#6EA6DA; --seg-g:#5E7489; --seg-l:#E0A050;
  --plate:#0A0F14; --plate-fg:#E2E8EE; --plate-muted:#7E8D9B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#1B252F; --line:#2A3642; --line-strong:#3A4856;
  --fg:#E2E8EE; --muted:#93A1AE; --accent:#6EA6DA; --accent-fg:#0E141A; --accent-soft:#1A2E42;
  --ok:#5DBB85; --ok-soft:#163024; --warn:#E3A84E; --warn-soft:#33260F; --crit:#F0756B; --crit-soft:#3A1816;
  --seg-m:#6EA6DA; --seg-g:#5E7489; --seg-l:#E0A050;
  --plate:#0A0F14; --plate-fg:#E2E8EE; --plate-muted:#7E8D9B; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.plate{background:var(--plate);color:var(--plate-fg);border-radius:var(--r);padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.plate h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em}
.plate .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11.5px;color:var(--plate-muted);text-transform:uppercase;letter-spacing:.06em}
.plate .meta b{color:var(--plate-fg);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--crit)}
button.btn{appearance:none;font:inherit;font-weight:500;font-size:13px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 12px;cursor:pointer;white-space:nowrap}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.btn.danger{color:var(--crit);border-color:var(--crit)}
button.btn.danger.armed{background:var(--crit);color:var(--surface)}
button.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.axisbar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.axischip{appearance:none;font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:150px}
.axischip b{font-family:var(--mono);font-size:15px;font-weight:600}
.axischip span{font-size:11.5px;color:var(--muted)}
.axischip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:15px;font-weight:600}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0;margin-bottom:4px}
.fhint{font-size:12px;color:var(--muted);margin:-2px 0 2px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:4px 10px;align-items:center}
.field label{font-size:13px}
.field small{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.field.wide{grid-template-columns:minmax(0,1fr)}
.inp{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2);min-width:0}
.inp input,.inp select,.field textarea,.field select{font:inherit;font-size:13.5px;color:var(--fg);background:transparent;border:0;padding:6px 8px;width:100%;min-width:0}
.inp input{font-family:var(--mono);text-align:right}
.inp.text input{text-align:left;font-family:var(--sans)}
.inp .u{font-family:var(--mono);font-size:11px;color:var(--muted);padding-right:8px;white-space:nowrap}
.field select{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2)}
.field textarea{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2);min-height:64px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dirty{font-size:12px;color:var(--warn);font-weight:500}
.saved{font-size:12px;color:var(--ok);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.stat .s{font-size:11.5px;color:var(--muted)}
h3{margin:0 0 8px;font-size:13px;font-weight:600}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.p{font-family:var(--mono);font-weight:500;white-space:nowrap}
td.dir{color:var(--muted);font-size:12px;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r);font-size:13px}
.checks li .tag{font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px}
.checks .crit{background:var(--crit-soft)} .checks .crit .tag{background:var(--crit);color:var(--surface)}
.checks .warn{background:var(--warn-soft)} .checks .warn .tag{background:var(--warn);color:var(--surface)}
.checks .ok{background:var(--ok-soft)} .checks .ok .tag{background:var(--ok);color:var(--surface)}
.checks .info{background:var(--surface-2)} .checks .info .tag{background:var(--line-strong);color:var(--fg)}
.ibar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ibar div{height:100%}
.ilegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.ilegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details{border:1px solid var(--line);border-radius:var(--r)}
summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px}
.calc{padding:4px 12px 12px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto}
.calc div{white-space:nowrap}
.calc .c{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:15px}
.libgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;align-items:start}
@media (max-width:900px){.libgrid{grid-template-columns:minmax(0,1fr)}}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.rowbtns button{padding:4px 9px;font-size:12px}
.muted{color:var(--muted)}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.sticky{position:static}}
#projbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
#projbar .pl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#projbar select{min-width:200px;max-width:100%}
#projbar .grow{flex:1}
.pform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;padding-top:8px;border-top:1px solid var(--line)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
#localbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r);font-size:12px;color:var(--muted)}
#localbar[hidden]{display:none}
#localbar b{color:var(--fg)}
#localbar .grow{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="plate">
    <h1>Réglages Servo</h1>

/* ---------- Calculs ---------- */
function compute(a) {
  const m = S.motors.find(x => x.id === a.moteurId), r = S.reducers.find(x => x.id === a.reducteurId);
  if (!m || !r) return { missing: true };
  const R = { m, r, checks: [], calc: [] };
  const i = num(r.ratio), eta = (num(r.rendement) ?? 100) / 100;
  const kt = num(m.kt) ?? ((num(m.m0) && num(m.i0)) ? num(m.m0) / num(m.i0) : null);
  const Jm = num(m.jMotor) ?? 0, Jg = num(r.jGear) ?? 0;
  const lin = (a.typeCharge || 'lineaire') === 'lineaire';
  const feed = num(a.feed) ?? (lin ? null : 360);
  if (!i || !kt) { R.missing = true; R.why = !i ? 'Le réducteur n’a pas de rapport.' : 'Le moteur n’a ni Kt ni M0/I0.'; return R; }
  const rmm = feed ? feed / (2 * Math.PI) : null;
  const masse = num(a.masse) ?? 0, jSupp = num(a.jSupp) ?? 0;
  const JLcharge = lin ? (rmm ? masse * rmm * rmm / 100 : 0) : (num(a.jLoadDirect) ?? 0);
  const JL = JLcharge + jSupp;
  const JLm = JL / (i * i), Jtot = Jm + Jg + JLm;
  Object.assign(R, { i, eta, kt, Jm, Jg, JL, JLm, Jtot, lin, feed, rmm, ratioIn: Jm ? JLm / Jm : null });

  // Référence du 100 % de UserCurrentLimit : courant max du moteur (le variateur n'intervient pas)
  const imax = num(m.imax), Iref = imax || null;
  const t2b = num(r.t2b), t2n = num(r.t2n), t2not = num(r.t2not);
  const marge = (num(a.marge) ?? 80) / 100;
  const I_T2B = t2b ? t2b / i / kt : null, I_T2N = t2n ? t2n / i / kt : null, I_T2Not = t2not ? t2not / i / kt : null;
  let Ilim = I_T2B ? I_T2B * marge : Iref;
  if (Iref && Ilim) Ilim = Math.min(Ilim, Iref);
  if (!Ilim) Ilim = null;
  const pct = Iref && Ilim ? Math.floor(Ilim / Iref * 1000) / 10 : null;
  Object.assign(R, { Iref, I_T2B, I_T2N, I_T2Not, Ilim, pct, marge });

  const vertical = lin && !!a.vertical;
  let Ihold = 0;
  if (vertical && rmm) Ihold = masse * 9.81 * (rmm / 1000) / i / eta / kt;
  const kAcc = feed ? Jtot * 1e-4 * (2 * Math.PI / feed) * i / kt : null; // A par Unit/s²
  const vMax = num(a.vMax), acc = num(a.acc);
  const accMax = kAcc && Ilim ? (Ilim - Ihold) / kAcc : null;
  const Iacc = kAcc && acc ? Ihold + kAcc * acc : null;
  const vPhys = num(m.nMax) && feed ? num(m.nMax) / 60 / i * feed : null;
  Object.assign(R, { vertical, Ihold, kAcc, accMax, Iacc, vPhys, vMax, acc });

  // Arrêt d'urgence
  const tStop = num(a.tStop) ?? 0.2;
  const iStopMa = num(a.iStopMa);
  const IstopA = iStopMa ? iStopMa / 1000 : Ilim;
  let dec = null, decLimited = false, jerkStop = null, tArret = null, stl = null, dist = null;
  if (vMax && kAcc) {
    const decV = vMax / tStop, decCur = IstopA ? (IstopA - Ihold) / kAcc * 0.9 : Infinity;
    dec = decV; if (decCur > 0 && decCur < decV) { dec = decCur; decLimited = true; }
    dec = nice(dec);
    jerkStop = nice(dec / 0.03);
    tArret = vMax / dec + 0.03;
    stl = Math.max(400, Math.ceil(tArret * 1.25 * 1000 / 50) * 50);
    dist = vMax * vMax / (2 * dec) + vMax * 0.015;
  }
  const driveStopMa = iStopMa ?? (IstopA ? Math.floor(IstopA * 10) * 100 : null);
  Object.assign(R, { tStop, dec, decLimited, jerkStop, tArret, stl, dist, driveStopMa, IstopA });

  // Jerk du mouvement
  const per = num(a.periode);
  R.jerkMove = per && acc ? nice(acc / per) : null;

  // Transposition des gains
  const vpA = num(a.velPActuel);
  if (vpA != null && (a.jLoadActuel !== '' && a.jLoadActuel != null)) {
    const Jold = Jm + (num(a.jGearActuel) ?? 0) + (num(a.jLoadActuel) ?? 0) / (i * i);
    R.gainFactor = Jold / Jtot; R.Jold = Jold;
    R.velPTransp = Math.round(vpA * R.gainFactor * 10) / 10;
  }

  // Vérifications
  const C = R.checks;
  if (vertical && !m.frein) C.push(['crit', 'Axe vertical sans frein moteur : la charge tombe à chaque coupure de couple.']);
  if (vertical && Ihold > Ilim) C.push(['crit', `Le maintien demande ${fmt(Ihold)} A, plus que la limite de ${fmt(Ilim)} A : l’axe ne peut pas tenir la charge.`]);
  if (vertical && iStopMa && iStopMa / 1000 <= Ihold) C.push(['crit', `La limite d’arrêt (${fmt(iStopMa, 0)} mA) est sous le courant de maintien (${fmt(Ihold)} A) : la charge tombe pendant l’arrêt.`]);
  if (vPhys && vMax && vMax > vPhys) C.push(['crit', `Vitesse programmée ${fmt(vMax, 0)} au-delà du maximum moteur (${fmt(vPhys, 0)} Units/s).`]);
  if (!t2b) C.push(['warn', 'Le réducteur n’a pas de T2B : la limite de courant n’est pas calculée vis-à-vis du réducteur.']);
  if (I_T2N && vertical && Ihold > I_T2N) C.push(['warn', `Le maintien (${fmt(Ihold)} A) dépasse le couple nominal T2N du réducteur (${fmt(I_T2N)} A).`]);
  if (accMax != null && acc && acc > accMax) C.push(['warn', `L’accélération programmée (${fmt(acc, 0)}) dépasse ce que permet la limite de courant (${fmt(accMax, 0)} Units/s²${vertical ? ' en montée' : ''}).`]);
  if (R.ratioIn != null && R.ratioIn > 10) C.push(['warn', `Rapport d’inertie charge/moteur de ${fmt(R.ratioIn, 1)} : régler les gains par petites étapes.`]);
  if (R.gainFactor && R.gainFactor < 0.7) C.push(['warn', `L’inertie déclarée est multipliée par ${fmt(1 / R.gainFactor, 1)} : baisser Vel_P_Gain AVANT d’augmenter J_Load, sinon le moteur grogne.`]);
  if (decLimited) C.push(['info', 'La décélération d’arrêt est limitée par le courant : l’arrêt dure plus longtemps que la durée visée.']);
  if (vertical) C.push(['info', 'Vérifier BrakeCouplingTime et BrakeDisconnectionTime (F1) : le frein doit tenir avant la coupure du couple.']);
  if (!imax) C.push(['warn', 'Imax du moteur non renseigné : UserCurrentLimit (%) ne peut pas être calculé. Le saisir dans l’onglet Moteurs (plaque moteur).']);
  if (!C.some(c => c[0] === 'crit' || c[0] === 'warn')) C.push(['ok', 'Aucune incohérence détectée sur cet ensemble.']);

  // Détail
  const L = R.calc;
  L.push(['Kt', kt, 'Nm/A', num(m.kt) ? 'TorqueConstant' : 'M0 ÷ I0']);
  if (lin) L.push(['Rayon équivalent', rmm, 'Units/rad', 'FeedConstant ÷ 2π']);
  L.push(['J charge', JLcharge, 'kg·cm²', lin ? 'masse × rayon² ÷ 100' : 'saisie']);
  L.push(['J_Load', JL, 'kg·cm²', 'J charge + inertie supplémentaire']);
  L.push(['J charge vue moteur', JLm, 'kg·cm²', 'J_Load ÷ i²']);
  L.push(['TotalInertia', Jtot, 'kg·cm²', 'MotorInertia + J_Gear + J_Load × (1/i)²']);
  if (I_T2B) L.push(['Courant à T2B', I_T2B, 'A', 'T2B ÷ i ÷ Kt']);
  L.push(['Courant limite', Ilim, 'A', I_T2B ? `${Math.round(marge * 100)} % du courant à T2B` : 'Imax moteur']);
  if (pct != null) L.push(['UserCurrentLimit', pct, '%', `Courant limite ÷ Imax moteur (${fmt(imax, 1)} A) × 100, arrondi en dessous`]);
  if (vertical) L.push(['Courant de maintien', Ihold, 'A', 'm × g × rayon ÷ i ÷ η ÷ Kt']);
  if (kAcc) L.push(['Courant par Unit/s²', kAcc * 1000, 'mA', 'TotalInertia × (2π ÷ Feed) × i ÷ Kt']);
  if (dec) L.push(['ControllerStopDec', dec, 'Units/s²', decLimited ? 'limité par le courant d’arrêt' : 'vMax ÷ durée visée']);
  return R;
}

/* ---------- Base de données ---------- */
function setStatus(t, err) { const s = $('#status'); s.textContent = t || ''; s.classList.toggle('err', !!err); s.hidden = !t; }
const pAxes = () => S.axes.filter(a => a.projetId === S.projId);
const curProj = () => S.projects.find(p => p.id === S.projId);
const projName = id => S.projects.find(p => p.id === id)?.nom || '';
function allLoaded() { return KEYS.every(k => S.loaded[k]); }
const LOCAL_KEY = 'reglages-servo-base';
function saveLocal() {
  const w = $('#localWarn');
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Object.fromEntries(KEYS.map(k => [k, S[k]])))); if (w) w.textContent = ''; }
  catch (e) { if (w) w.textContent = 'Le navigateur bloque l’enregistrement : exporte la base avant de fermer.'; }
}
function loadBase(o) { KEYS.forEach(k => { S[k] = Array.isArray(o?.[k]) ? o[k].filter(x => x && x.id) : []; S.loaded[k] = true; }); }
async function writeDoc(key, id, data) {
  if (S.db) { await S.db.collection(COLL[key]).doc(id).set(data); }
  else { const arr = S[key]; const ix = arr.findIndex(x => x.id === id); const doc = { id, ...data }; if (ix >= 0) arr[ix] = doc; else arr.push(doc); saveLocal(); onData(); }
}
async function deleteDoc(key, id) {
  if (S.db) await S.db.collection(COLL[key]).doc(id).delete();
  else { S[key] = S[key].filter(x => x.id !== id); saveLocal(); onData(); }
}
function newId(key) { try { if (S.db) return S.db.collection(COLL[key]).doc().id; } catch (e) {} return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function strip(o) { const c = { ...o }; delete c.id; return c; }

function onData() {
  KEYS.forEach(k => { const el = $('#cnt-' + k); if (el) el.textContent = S.loaded[k] ? S[k].length : ''; });
  S.axes.sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr', { numeric: true }));
  const bySerie = (a, b) => String(a.serie || '~').localeCompare(String(b.serie || '~'), 'fr', { numeric: true }) || ((num(a.ratio) ?? 0) - (num(b.ratio) ?? 0)) || String(a.ref).localeCompare(String(b.ref), 'fr', { numeric: true });
  S.motors.sort(bySerie); S.reducers.sort(bySerie); S.drives.sort(bySerie);
  if (allLoaded() && !S.db) $('#localbar').hidden = false;
  if (allLoaded()) migrate();
  S.projects.sort((a, b) => (a.statut === 'termine') - (b.statut === 'termine') || (b.cree || 0) - (a.cree || 0));
  if (!S.projects.find(p => p.id === S.projId)) { let t = null; try { t = localStorage.getItem('servo-proj'); } catch (e) {} S.projId = S.projects.find(p => p.id === t)?.id || S.projects[0]?.id || null; S.axisId = null; S.dirty = false; }
  const PA = pAxes();
  if (!S.axisId || (!PA.find(a => a.id === S.axisId) && !(S.draft && S.draft._new))) { S.axisId = PA[0]?.id || null; S.dirty = false; }
  if (!S.dirty) { const a = PA.find(x => x.id === S.axisId); S.draft = a ? { ...a } : (S.draft && S.draft._new ? S.draft : null); }
  render();
}

/* ---------- Rendu ---------- */
let migrating = false;
async function migrate() {
  if (migrating) return;
  const orphans = S.axes.filter(a => !a.projetId);
  if (!orphans.length && S.projects.length) return;
  migrating = true;
  try {
    let pid = S.projects[0]?.id;
    if (!pid) { pid = 'projet-1'; await writeDoc('projects', pid, { nom: 'Projet 1', statut: 'en cours', cree: Date.now() }); }
    for (const a of orphans) await writeDoc('axes', a.id, { ...strip(a), projetId: pid });
  } catch (e) { setStatus('Migration vers les projets impossible : ' + (e.message || e.code), true); }
}
function renderProj() {
  const b = $('#projbar'); if (!b) return;
  if (!allLoaded()) { b.innerHTML = ''; return; }
  const cur = curProj(), done = cur?.statut === 'termine';
  const opts = (st, lab) => { const l = S.projects.filter(p => (p.statut === 'termine') === (st === 'termine')); return l.length ? `<optgroup label="${lab}">${l.map(p => `<option value="${esc(p.id)}" ${p.id === S.projId ? 'selected' : ''}>${esc(p.nom)}</option>`).join('')}</optgroup>` : ''; };
  const n = cur ? pAxes().length : 0;
  b.innerHTML = `<span class="pl">Projet</span>${S.projects.length ? `<select id="projSel" aria-label="Projet">${opts('en cours', 'En cours')}${opts('termine', 'Terminés (sauvegardés)')}</select>` : '<span class="muted">Aucun projet</span>'}
    ${cur ? `<span class="pill ${done ? 'done' : ''}">${done ? 'Terminé' : 'En cours'} · ${n} axe${n > 1 ? 's' : ''}</span>` : ''}<span class="grow"></span>
    ${cur ? `<button class="btn" id="projRen">Renommer</button><button class="btn" id="projDone">${done ? 'Rouvrir' : 'Terminer le projet'}</button>` : ''}
    <button class="btn primary" id="projNew">+ Nouveau projet</button>
    ${S.projForm ? `<div class="pform"><div class="inp text" style="flex:1;min-width:200px"><input id="pfNom" placeholder="Nom du projet (machine, client…)" value="${esc(S.projForm.nom)}" autocomplete="off"></div>
      ${S.projForm.mode === 'new' && cur && n ? `<label class="chk"><input type="checkbox" id="pfCopy" ${S.projForm.copy ? 'checked' : ''}> Copier les ${n} axes de « ${esc(cur.nom)} »</label>` : ''}
      <button class="btn primary" id="pfOk">${S.projForm.mode === 'new' ? 'Créer' : 'Enregistrer'}</button><button class="btn" id="pfCancel">Annuler</button></div>` : ''}`;
  const sel = $('#projSel'); if (sel) sel.onchange = () => { if (S.dirty && !confirm_()) { sel.value = S.projId; return; } S.projId = sel.value; S.axisId = null; S.dirty = false; S.draft = null; try { localStorage.setItem('servo-proj', S.projId); } catch (e) {} onData(); };
  $('#projNew').onclick = () => { S.projForm = { mode: 'new', nom: '', copy: false }; renderProj(); $('#pfNom').focus(); };
  const rn = $('#projRen'); if (rn) rn.onclick = () => { S.projForm = { mode: 'ren', nom: cur.nom }; renderProj(); $('#pfNom').focus(); };
  const dn = $('#projDone'); if (dn) dn.onclick = async () => { try { await writeDoc('projects', cur.id, { ...strip(cur), statut: done ? 'en cours' : 'termine', termine: done ? null : Date.now() }); setStatus(done ? '' : 'Projet terminé et sauvegardé. Crée le suivant avec « Nouveau projet ».'); } catch (e) { setStatus('Impossible : ' + (e.message || e.code), true); } };
  if (S.projForm) {
    $('#pfNom').oninput = e => { S.projForm.nom = e.target.value; };
    const c = $('#pfCopy'); if (c) c.onchange = () => { S.projForm.copy = c.checked; };
    $('#pfCancel').onclick = () => { S.projForm = null; renderProj(); };
    $('#pfOk').onclick = async () => {
      const f = S.projForm, nom = (f.nom || '').trim(); if (!nom) { setStatus('Donne un nom au projet.', true); return; }
      try {
        if (f.mode === 'ren') await writeDoc('projects', cur.id, { ...strip(cur), nom });
        else {
          const id = newId('projects'), from = S.projId;
          await writeDoc('projects', id, { nom, statut: 'en cours', cree: Date.now() });
          if (f.copy) for (const a of S.axes.filter(x => x.projetId === from)) await writeDoc('axes', newId('axes'), { ...strip(a), projetId: id });
          S.projId = id; S.axisId = null; S.draft = null; S.dirty = false; try { localStorage.setItem('servo-proj', id); } catch (e) {}
        }
        S.projForm = null; setStatus(''); onData();
      } catch (e) { setStatus('Impossible : ' + (e.message || e.code), true); }
    };
  }
}
const confirm_ = () => { setStatus('Modifications non enregistrées : enregistre ou annule l’axe avant de changer de projet.', true); return false; };
function render() {
  renderProj();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  if (S.tab === 'axes') renderAxes(); else renderLib(S.tab);
}

function inputHtml(f, val, prefix) {
  const id = prefix + f.k;
  if (f.t === 'bool') return `<div class="field wide"><label class="chk"><input type="checkbox" id="${id}" data-k="${f.k}" ${val ? 'checked' : ''}> ${esc(f.l)}</label></div>`;
  if (f.t === 'area') return `<div class="field wide"><label for="${id}">${esc(f.l)}</label><textarea id="${id}" data-k="${f.k}">${esc(val)}</textarea></div>`;
  let ctrl;
  if (f.t === 'motor' || f.t === 'reducer' || f.t === 'drive') {
    const list = f.t === 'motor' ? S.motors : f.t === 'reducer' ? S.reducers : S.drives;
    const groups = new Map(); list.forEach(x => { const g = x.serie || 'Autres'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(x); });
    const opt = x => `<option value="${esc(x.id)}" ${x.id === val ? 'selected' : ''}>${esc(x.ref)}${f.t === 'reducer' && x.ratio ? ' · i=' + esc(x.ratio) : ''}${f.t === 'drive' && x.iPeak ? ' · ' + esc(x.iPeak) + ' A' : ''}</option>`;
    ctrl = `<select id="${id}" data-k="${f.k}"><option value="">— Choisir —</option>${[...groups].map(([g, xs]) => `<optgroup label="${esc(g)}">${xs.map(opt).join('')}</optgroup>`).join('')}</select>`;
    return `<div class="field wide"><label for="${id}">${esc(f.l)}</label>${ctrl}</div>`;
  }
  if (f.t === 'select') {
    ctrl = `<select id="${id}" data-k="${f.k}">${f.o.map(([v, l]) => `<option value="${v}" ${v === (val || f.o[0][0]) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    return `<div class="field wide"><label for="${id}">${esc(f.l)}</label>${ctrl}</div>`;
  }
  const txt = f.t === 'text';
  ctrl = `<div class="inp ${txt ? 'text' : ''}"><input id="${id}" data-k="${f.k}" ${txt ? '' : 'inputmode="decimal"'} autocomplete="off" value="${esc(val == null ? '' : (txt ? val : String(val).replace('.', ',')))}">${f.u ? `<span class="u">${esc(f.u)}</span>` : ''}</div>`;
  return `<div class="field ${txt ? 'wide' : ''}"><label for="${id}">${esc(f.l)}</label>${ctrl}${f.h ? `<small>${esc(f.h)}</small>` : ''}</div>`;
}
function readInput(el) { if (el.type === 'checkbox') return el.checked; const k = el.dataset.k; return NUM_KEYS.has(k) ? (num(el.value)) : el.value; }

function renderAxes() {
  const v = $('#view');
  if (!allLoaded()) { v.innerHTML = ''; return; }
  const chips = pAxes().map(a => {
    const m = S.motors.find(x => x.id === a.moteurId), r = S.reducers.find(x => x.id === a.reducteurId);
    return `<button class="axischip" data-axis="${esc(a.id)}" aria-pressed="${a.id === S.axisId && !(S.draft && S.draft._new)}"><b>${esc(a.nom || 'Sans nom')}</b><span>${esc(m?.ref || 'moteur ?')} · ${esc(r ? (r.marque ? r.marque + ' ' : '') + 'i=' + r.ratio : 'réducteur ?')}</span></button>`;
  }).join('');
  const bar = `<div class="axisbar">${chips}<button class="btn" id="newAxis">+ Nouvel axe</button></div>`;
  if (!S.draft) {
    if (!S.projects.length) { v.innerHTML = `<div class="panel"><div class="empty"><b>Aucun projet</b><span>Crée ton premier projet avec « Nouveau projet » pour y ajouter des axes.</span></div></div>`; return; }
    v.innerHTML = bar + `<div class="panel" style="margin-top:12px"><div class="empty"><b>Aucun axe dans ce projet</b><span>Ajoute un moteur et un réducteur dans leurs onglets, puis crée un axe pour obtenir ses réglages.</span></div></div>`;
    bindAxes(); return;
  }
  const d = S.draft, lin = (d.typeCharge || 'lineaire') === 'lineaire';
  const form = AXIS_GROUPS.map(g => `<fieldset><legend>${esc(g.t)}</legend>${g.h ? `<p class="fhint">${esc(g.h)}</p>` : ''}${g.f.filter(f => !f.show || f.show === (lin ? 'lineaire' : 'rotatif')).map(f => inputHtml(f, d[f.k], 'ax-')).join('')}</fieldset>`).join('');
  const isNew = !!d._new;
  v.innerHTML = bar + `<div class="cols" style="margin-top:12px">
    <section class="panel"><div class="panel-h"><h2>${isNew ? 'Nouvel axe' : 'Axe ' + esc(d.nom || '')}</h2><span id="dirtyTag"></span></div>
      <div class="panel-b" id="axisForm">${form}
        <div class="actions"><button class="btn primary" id="saveAxis">Enregistrer</button>
        ${isNew ? '<button class="btn" id="cancelAxis">Annuler</button>' : '<button class="btn" id="dupAxis">Dupliquer</button><button class="btn danger" id="delAxis">Supprimer</button>'}</div>
      </div></section>
    <section class="panel sticky" id="results"></section></div>`;
  bindAxes();
  renderResults(); updateDirty();
}

function updateDirty() { const t = $('#dirtyTag'); if (!t) return; t.innerHTML = S.dirty ? '<span class="dirty">Modifications non enregistrées</span>' : (S.justSaved ? '<span class="saved">Enregistré</span>' : ''); }

function renderResults() {
  const box = $('#results'); if (!box) return;
  const R = compute(S.draft);
  if (R.missing) { box.innerHTML = `<div class="panel-h"><h2>Réglages calculés</h2></div><div class="empty"><b>Ensemble incomplet</b><span>${esc(R.why || 'Choisis un moteur et un réducteur pour lancer les calculs.')}</span></div>`; return; }
  const P = [];
  P.push(['GearIn', '1', '', 'Mechanic']);
  P.push(['GearOut', fmt(R.i, 3), '', 'Mechanic']);
  if (R.feed) P.push(['FeedConstant', fmt(R.feed, 3), 'Units/tr', 'Mechanic']);
  P.push(['J_Load', fmt(Math.round(R.JL / 10) * 10, 0), 'kg·cm²', 'Mechanic', true]);
  P.push(['J_Gear', fmt(R.Jg, 3), 'kg·cm²', 'Mechanic', true]);
  if (R.pct != null) P.push(['UserCurrentLimit', fmt(R.pct, 1), '%', 'General', true]);
  if (R.driveStopMa != null) P.push(['DriveStopCurrentLimit', fmt(R.driveStopMa, 0), 'mA', 'General', true]);
  if (R.dec) { P.push(['ControllerStopDec', fmt(R.dec, 0), 'Units/s²', 'General', true]); P.push(['ControllerStopJerk', fmt(R.jerkStop, 0), 'Units/s³', 'General', true]); P.push(['StopTimeLim', fmt(R.stl, 0), 'ms', 'General']); }
  P.push(['UserDefinedStopMode', 'Start with actual values', '', 'General']);
  const vpR = num(S.draft.velPRetenu), viR = num(S.draft.velIRetenu);
  if (vpR != null) P.push(['Vel_P_Gain', fmt(vpR, 2), '', 'Control loop', true]);
  else if (R.velPTransp != null) P.push(['Vel_P_Gain', fmt(R.velPTransp, 1) + ' (point de départ)', '', 'Control loop', true]);
  if (viR != null) P.push(['Vel_I_Gain', fmt(viR, 2), '', 'Control loop', true]);
  if (R.jerkMove) P.push(['Jerk du mouvement', fmt(R.jerkMove, 0), 'Units/s³', 'Programme']);

  const seg = (v, c) => R.Jtot > 0 ? `<div style="width:${Math.max(0, v / R.Jtot * 100)}%;background:var(${c})"></div>` : '';
  const stats = [
    ['UserCurrentLimit', fmt(R.pct, 1), '%', R.Iref ? `${fmt(R.Ilim)} A sur Imax moteur ${fmt(R.Iref, 1)} A` : 'Imax moteur à renseigner'],
    R.vertical ? ['Courant de maintien', fmt(R.Ihold), 'A', 'gravité, en permanence'] : ['Courant à T2N', fmt(R.I_T2N), 'A', 'couple continu du réducteur'],
    ['Accélération max', fmt(R.accMax, 0), 'Units/s²', R.vertical ? 'en montée, à la limite' : 'à la limite de courant'],
    ['Distance d’arrêt', fmt(R.dist, 1), 'Units', R.tArret ? `en ${fmt(R.tArret * 1000, 0)} ms` : 'vitesse max à renseigner']
  ];
  box.innerHTML = `<div class="panel-h"><h2>Réglages calculés</h2><button class="btn" id="copyP">Copier les paramètres</button></div>
  <div class="panel-b">
    <div class="stats">${stats.map(s => `<div class="stat"><div class="k">${esc(s[0])}</div><div class="v">${s[1]}<small>${esc(s[2])}</small></div><div class="s">${esc(s[3])}</div></div>`).join('')}</div>
    <div><h3>Paramètres à saisir dans le variateur</h3><div class="tblwrap"><table><thead><tr><th>Paramètre</th><th class="n">Valeur</th><th>Unité</th><th>Dossier</th></tr></thead><tbody>
      ${P.map(p => `<tr class="${p[4] ? 'hl' : ''}"><td class="p">${esc(p[0])}</td><td class="n">${esc(p[1])}</td><td class="dir">${esc(p[2])}</td><td class="dir">${esc(p[3])}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div><h3>Vérifications</h3><ul class="checks">${R.checks.map(c => `<li class="${c[0]}"><span class="tag">${{ crit: 'Danger', warn: 'Attention', info: 'À voir', ok: 'OK' }[c[0]]}</span><span>${esc(c[1])}</span></li>`).join('')}</ul></div>
    <div><h3>Inertie vue par le moteur · ${fmt(R.Jtot, 2)} kg·cm²</h3>
      <div class="ibar" role="img" aria-label="Répartition de l’inertie">${seg(R.Jm, '--seg-m')}${seg(R.Jg, '--seg-g')}${seg(R.JLm, '--seg-l')}</div>
      <div class="ilegend"><span><i style="background:var(--seg-m)"></i>Moteur ${fmt(R.Jm, 2)}</span><span><i style="background:var(--seg-g)"></i>Réducteur ${fmt(R.Jg, 2)}</span><span><i style="background:var(--seg-l)"></i>Charge ${fmt(R.JLm, 3)}</span><span>Rapport charge/moteur ${fmt(R.ratioIn, 2)}</span></div>
      ${R.gainFactor ? `<p class="fhint" style="margin-top:8px">Inertie déclarée actuelle : ${fmt(R.Jold, 2)} kg·cm². Facteur sur les gains : × ${fmt(1 / R.gainFactor, 2)}, d’où Vel_P_Gain ≈ ${fmt(num(S.draft.velPActuel), 2)} × ${fmt(R.gainFactor, 3)} = ${fmt(R.velPTransp, 1)}.</p>` : ''}
    </div>
    <details><summary>Détail des calculs</summary><div class="calc">
      ${R.calc.map(c => `<div>${esc(c[0])} = <b>${fmt(c[1], 4)}</b> ${esc(c[2])} <span class="c">· ${esc(c[3])}</span></div>`).join('')}
      <div class="c">Limites réducteur en courant : T2N ${fmt(R.I_T2N)} A · T2B ${fmt(R.I_T2B)} A · T2Not ${fmt(R.I_T2Not)} A</div>
      ${R.vPhys ? `<div class="c">Vitesse max physique : ${fmt(R.vPhys, 0)} Units/s (nMax ÷ 60 ÷ i × Feed)</div>` : ''}
    </div></details>
  </div>`;
  $('#copyP').onclick = async (e) => {
    const txt = `Axe ${S.draft.nom || ''}\n` + P.map(p => `${p[0]} = ${p[1]}${p[2] ? ' ' + p[2] : ''}`).join('\n');
    try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copié'; setTimeout(() => { e.target.textContent = 'Copier les paramètres'; }, 1500); }
    catch { e.target.textContent = 'Copie refusée'; }
  };
}

function bindAxes() {
  document.querySelectorAll('[data-axis]').forEach(b => b.onclick = () => {
    if (S.dirty && !b.dataset.force) { b.dataset.force = '1'; setStatus('Modifications non enregistrées : clique à nouveau sur l’axe pour les abandonner.'); return; }
    setStatus(''); S.axisId = b.dataset.axis; S.dirty = false; S.justSaved = false; S.draft = { ...pAxes().find(a => a.id === S.axisId) }; render();
  });
  const nb = $('#newAxis'); if (nb) nb.onclick = () => { S.draft = { _new: true, nom: '', typeCharge: 'lineaire', marge: 80, tStop: 0.2 }; S.dirty = true; S.justSaved = false; render(); };
  const form = $('#axisForm'); if (!form) return;
  form.addEventListener('input', e => { const el = e.target; if (!el.dataset.k) return; S.draft[el.dataset.k] = readInput(el); S.dirty = true; S.justSaved = false; updateDirty(); renderResults(); });
  form.addEventListener('change', e => { const el = e.target; if (!el.dataset.k) return; S.draft[el.dataset.k] = readInput(el); S.dirty = true; if (el.dataset.k === 'typeCharge') renderAxes(); else { updateDirty(); renderResults(); } });
  $('#saveAxis').onclick = async () => {
    const d = { ...S.draft, projetId: S.projId }; const isNew = d._new; delete d._new;
    if (!d.nom) { setStatus('Donne un nom à l’axe avant d’enregistrer.', true); return; }
    const id = isNew ? newId('axes') : d.id; delete d.id;
    try { S.axisId = id; S.dirty = false; S.justSaved = true; S.draft = { id, ...d }; await writeDoc('axes', id, d); setStatus(''); updateDirty(); render(); }
    catch (e) { S.dirty = true; setStatus('Enregistrement impossible : ' + (e.message || e.code), true); }
  };
  const cancel = $('#cancelAxis'); if (cancel) cancel.onclick = () => { S.dirty = false; S.draft = null; onData(); };
  const dup = $('#dupAxis'); if (dup) dup.onclick = () => { const c = { ...S.draft, _new: true, nom: (S.draft.nom || '') + ' (copie)' }; delete c.id; S.draft = c; S.dirty = true; render(); };
  const del = $('#delAxis'); if (del) del.onclick = async () => {
    if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Confirmer la suppression'; return; }
    try { const id = S.draft.id; S.draft = null; S.axisId = null; S.dirty = false; await deleteDoc('axes', id); }
    catch (e) { setStatus('Suppression impossible : ' + (e.message || e.code), true); }
  };
}

function renderLib(key) {
  const v = $('#view'); if (!allLoaded()) { v.innerHTML = ''; return; }
  const isM = key === 'motors', isD = key === 'drives', FIELDS = isM ? MOTOR_FIELDS : isD ? DRIVE_FIELDS : REDUCER_FIELDS;
  const q = (S.search[key] || '').toLowerCase().trim();
  const list = S[key].filter(x => !q || [x.ref, x.serie, x.marque, x.ratio != null ? 'i=' + x.ratio : ''].join(' ').toLowerCase().includes(q));
  const noun = isM ? 'moteur' : isD ? 'variateur' : 'réducteur';
  const cols = isD
    ? [['Référence', x => esc(x.ref)], ['Série', x => esc(x.serie)], ['Crête', x => fmt(num(x.iPeak), 1) + ' A', 'n'], ['Permanent', x => fmt(num(x.iNom), 1) + ' A', 'n'], ['Format', x => esc(x.format)]]
    : isM
    ? [['Référence', x => esc(x.ref)], ['Kt', x => fmt(num(x.kt) ?? (num(x.m0) / num(x.i0)), 3), 'n'], ['Inertie', x => fmt(num(x.jMotor), 3), 'n'], ['Imax', x => fmt(num(x.imax), 1), 'n'], ['tr/min', x => `${fmt(num(x.nNom), 0)} / ${fmt(num(x.nMax), 0)}`, 'n'], ['Frein', x => x.frein ? 'Oui' : 'Non']]
    : [['Référence', x => esc(x.ref)], ['Marque', x => esc(x.marque)], ['i', x => fmt(num(x.ratio), 3), 'n'], ['T2N', x => fmt(num(x.t2n), 0), 'n'], ['T2B', x => fmt(num(x.t2b), 0), 'n'], ['T2Not', x => fmt(num(x.t2not), 0), 'n'], ['J_Gear', x => fmt(num(x.jGear), 3), 'n'], ['η', x => x.rendement ? fmt(num(x.rendement), 0) + ' %' : '—', 'n']];
  const used = id => S.axes.filter(a => (isM ? a.moteurId : isD ? a.variateurId : a.reducteurId) === id).map(a => (projName(a.projetId) ? projName(a.projetId) + ' › ' : '') + a.nom);
  const table = list.length ? `<div class="tblwrap"><table><thead><tr>${cols.map(c => `<th class="${c[2] || ''}">${c[0]}</th>`).join('')}<th>Axes</th><th></th></tr></thead><tbody>
    ${list.map(x => `<tr><td class="p">${cols[0][1](x)}</td>${cols.slice(1).map(c => `<td class="${c[2] || ''}">${c[1](x)}</td>`).join('')}<td class="muted">${esc(used(x.id).join(', ') || '—')}</td>
      <td><div class="rowbtns"><button class="btn" data-edit="${esc(x.id)}">Modifier</button><button class="btn danger ${S.confirm === x.id ? 'armed' : ''}" data-del="${esc(x.id)}">${S.confirm === x.id ? 'Confirmer' : 'Supprimer'}</button></div></td></tr>`).join('')}
    </tbody></table></div>` : (q ? `<div class="empty"><b>Aucun résultat</b><span>Rien ne correspond à « ${esc(S.search[key])} ».</span></div>` : `<div class="empty"><b>Aucun ${noun} dans la base</b><span>Remplis le formulaire à droite pour ajouter le premier.</span></div>`);
  const ed = S.lib[key] || {};
  const form = `<section class="panel"><div class="panel-h"><h2>${ed.id ? 'Modifier ' + esc(ed.ref || '') : 'Ajouter un ' + noun}</h2></div>
    <div class="panel-b" id="libForm"><fieldset>${FIELDS.map(f => inputHtml(f, ed[f.k], 'lib-')).join('')}</fieldset>
    <div class="actions"><button class="btn primary" id="libSave">${ed.id ? 'Enregistrer' : 'Ajouter'}</button>${ed.id ? '<button class="btn" id="libCancel">Annuler</button>' : ''}</div></div></section>`;
  v.innerHTML = `<div class="libgrid"><section class="panel"><div class="panel-h"><h2>${isM ? 'Moteurs' : isD ? 'Variateurs' : 'Réducteurs'}</h2><span class="muted" style="font-size:12px">${q ? list.length + ' sur ' : ''}${S[key].length} dans la base</span></div><div class="panel-b"><div class="inp text"><input id="libSearch" placeholder="Rechercher (référence, série, i=7…)" value="${esc(S.search[key])}" autocomplete="off"></div><div id="libTable">${table}</div></div></section>${form}</div>`;
  const ls = $('#libSearch'); ls.oninput = () => { S.search[key] = ls.value; const pos = ls.selectionStart; render(); const n = $('#libSearch'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
  v.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.lib[key] = { ...list.find(x => x.id === b.dataset.edit) }; S.confirm = null; render(); });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del, u = used(id);
    if (u.length) { setStatus(`Impossible de supprimer : utilisé par ${u.join(', ')}. Change d’abord ${u.length > 1 ? 'ces axes' : 'cet axe'}.`, true); return; }
    if (S.confirm !== id) { S.confirm = id; render(); return; }
    S.confirm = null; try { await deleteDoc(key, id); setStatus(''); } catch (e) { setStatus('Suppression impossible : ' + (e.message || e.code), true); }
  });
  const lf = $('#libForm');
  const sync = e => { const el = e.target; if (!el.dataset.k) return; S.lib[key] = { ...(S.lib[key] || {}), [el.dataset.k]: readInput(el) }; };
  lf.addEventListener('input', sync); lf.addEventListener('change', sync);
  $('#libSave').onclick = async () => {
    const d = { ...(S.lib[key] || {}) };
    if (!d.ref) { setStatus('La référence est obligatoire.', true); return; }
    if (!isM && !isD && !num(d.ratio)) { setStatus('Le rapport de réduction est obligatoire.', true); return; }
    const id = d.id || newId(key); delete d.id;
    try { await writeDoc(key, id, d); S.lib[key] = null; setStatus(''); render(); } catch (e) { setStatus('Enregistrement impossible : ' + (e.message || e.code), true); }
  };
  const lc = $('#libCancel'); if (lc) lc.onclick = () => { S.lib[key] = null; render(); };
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.confirm = null; try { localStorage.setItem('servo-tab', S.tab); } catch (e) {} render(); });
try { const t = localStorage.getItem('servo-tab'); if (t && ['axes', 'motors', 'reducers', 'drives'].includes(t)) S.tab = t; } catch (e) {}

(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  S.db = db;
  if (!db) {
    let base = null;
    try { base = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) {}
    if (!base) { try { base = JSON.parse(document.getElementById('seed')?.textContent || 'null'); } catch (e) {} if (base) saveLocal.pending = true; }
    loadBase(base);
    if (saveLocal.pending) saveLocal();
    $('#expBase').onclick = () => {
      const blob = new Blob([JSON.stringify(Object.fromEntries(KEYS.map(k => [k, S[k]])), null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'base-reglages-servo-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
    $('#impBase').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      try { const o = JSON.parse(await f.text()); if (!KEYS.some(k => Array.isArray(o[k]))) throw new Error('fichier non reconnu');
        loadBase(o); S.projId = null; S.axisId = null; S.draft = null; S.dirty = false; saveLocal(); setStatus('Base importée : ' + S.motors.length + ' moteurs, ' + S.reducers.length + ' réducteurs, ' + S.axes.length + ' axes.'); onData(); }
      catch (err) { setStatus('Import impossible : ' + err.message, true); }
    };
    onData(); return;
  }
  KEYS.forEach(key => {
    db.collection(COLL[key]).onSnapshot(snap => { S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded[key] = true; onData(); },
      e => setStatus('Lecture de la base impossible (' + e.code + ').', true));
  });
})();
</script>

</body>
</html>
