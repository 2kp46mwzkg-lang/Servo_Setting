<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réglages Servo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Outil d'atelier : en-tête plaque + onglets, puis deux colonnes (saisie | ce qu'il faut taper dans le variateur) */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#D3DAE1; --line-strong:#B9C3CC;
  --fg:#15202A; --muted:#5A6774; --accent:#1D5A8E; --accent-fg:#FFFFFF; --accent-soft:#DFEAF5;
  --ok:#2C7A4C; --ok-soft:#E1F1E7; --warn:#9C5D0E; --warn-soft:#FBEFD9; --crit:#B3261E; --crit-soft:#FBE3E1;
  --seg-m:#1D5A8E; --seg-g:#B4C3D1; --seg-l:#5E7A93;
  --plate:#1B2632; --plate-fg:#E8EDF2; --plate-muted:#9AAAB9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface-2:#1B252F; --line:#2A3642; --line-strong:#3A4856;
  --fg:#E2E8EE; --muted:#93A1AE; --accent:#6EA6DA; --accent-fg:#0E141A; --accent-soft:#1A2E42;
  --ok:#5DBB85; --ok-soft:#163024; --warn:#E3A84E; --warn-soft:#33260F; --crit:#F0756B; --crit-soft:#3A1816;
  --seg-m:#6EA6DA; --seg-g:#3A4B5C; --seg-l:#9DB2C6;
  --plate:#0A0F14; --plate-fg:#E2E8EE; --plate-muted:#7E8D9B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#1B252F; --line:#2A3642; --line-strong:#3A4856;
  --fg:#E2E8EE; --muted:#93A1AE; --accent:#6EA6DA; --accent-fg:#0E141A; --accent-soft:#1A2E42;
  --ok:#5DBB85; --ok-soft:#163024; --warn:#E3A84E; --warn-soft:#33260F; --crit:#F0756B; --crit-soft:#3A1816;
  --seg-m:#6EA6DA; --seg-g:#3A4B5C; --seg-l:#9DB2C6;
  --plate:#0A0F14; --plate-fg:#E2E8EE; --plate-muted:#7E8D9B; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.plate{background:var(--plate);color:var(--plate-fg);border-radius:var(--r);padding:8px 8px 8px 18px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.plate h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{appearance:none;border:0;background:none;color:var(--plate-muted);font:inherit;font-weight:500;padding:7px 14px;border-radius:4px;cursor:pointer}
.tab:hover{color:var(--plate-fg)}
.tab[aria-selected="true"]{background:var(--plate-fg);color:var(--plate)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--crit)}
.btn{appearance:none;font:inherit;font-weight:500;font-size:13px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
/* Barre projet + axes */
.topbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.topbar select{font:inherit;font-weight:600;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 8px;max-width:100%}
.topbar .lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.topbar .grow{flex:1}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.axisbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.axischip{appearance:none;font:inherit;font-family:var(--mono);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:6px 14px;cursor:pointer}
.axischip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:15px;font-weight:600}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:18px}
/* Formulaire */
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0;margin-bottom:4px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:4px 10px;align-items:center}
.field label{font-size:13px}
.fnote{grid-column:1/-1;text-align:right;font-size:11px;color:var(--muted,#6b7280);margin-top:-2px}.todo{color:#b45309;font-style:italic}
.field label .hint{text-decoration:underline dotted var(--line-strong);text-underline-offset:3px;cursor:help}
.gtag{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font-size:10px;font-weight:600;line-height:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);vertical-align:1px;cursor:help}
.field{border-radius:var(--r);transition:background-color .15s,box-shadow .15s}
.field.glow{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}
.field.g-ok .inp,.field.g-ok select{border-color:var(--ok);background:var(--ok-soft)}
.field.g-warn .inp,.field.g-warn select{border-color:var(--warn);background:var(--warn-soft)}
.field.g-crit .inp,.field.g-crit select{border-color:var(--crit);background:var(--crit-soft)}
.field.g-ok .chk,.field.g-warn .chk,.field.g-crit .chk{padding:5px 8px;border-radius:var(--r);border:1px solid}
.field.g-ok .chk{border-color:var(--ok);background:var(--ok-soft)}
.field.g-warn .chk{border-color:var(--warn);background:var(--warn-soft)}
.field.g-crit .chk{border-color:var(--crit);background:var(--crit-soft)}
.field.g-ok .inp,.field.g-warn .inp,.field.g-crit .inp,.field.g-ok select,.field.g-warn select,.field.g-crit select{border-width:1.5px}
.gi{border-radius:var(--r);transition:background-color .15s,box-shadow .15s}
.gi.glow{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}
.gi .dep{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px}
.glegend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.field.wide{grid-template-columns:minmax(0,1fr)}
.inp{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2);min-width:0}
.inp input,.field textarea,.field select{font:inherit;font-size:13.5px;color:var(--fg);background:transparent;border:0;padding:6px 8px;width:100%;min-width:0}
.inp input{font-family:var(--mono);text-align:right}
.inp.text input{text-align:left;font-family:var(--sans)}
.inp .u{font-family:var(--mono);font-size:11px;color:var(--muted);padding-right:8px;white-space:nowrap}
.field select{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2)}
.field textarea{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2);min-height:64px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dirty{font-size:12px;color:var(--warn);font-weight:500}
.saved{font-size:12px;color:var(--ok);font-weight:500}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style-position:inside}
details.more[open]>summary{margin-bottom:12px}
details.more .inner{display:flex;flex-direction:column;gap:18px}
/* Résultats : paramètres variateur */
.pgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.pgroup{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.rsum{font-size:12px;color:var(--muted);font-family:var(--mono);padding:2px 2px 0}
.combo{position:relative;min-width:0}
.combo .inp input{font-family:var(--sans);text-align:left}
.combo-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:min(60vh,480px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:0 10px 28px rgba(15,25,35,.18)}
.cgrp{position:sticky;top:0;padding:4px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.copt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--surface-2)}
.copt:hover{background:var(--surface-2)}
.copt b{font-weight:600;font-family:var(--mono);font-size:12.5px}
.copt small{color:var(--muted);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.copt[aria-selected="true"]{background:var(--accent-soft)}
.copt.cur b::after{content:" ✓";color:var(--accent)}
.cempty{padding:10px;font-size:12.5px;color:var(--muted)}
.rsum b{color:var(--fg);font-weight:600}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.keys .keyt{grid-column:span 2}.keys .keyt.g2{grid-column:span 3}@media(max-width:640px){.keys{grid-template-columns:repeat(2,minmax(0,1fr))}.keys .keyt,.keys .keyt.g2{grid-column:span 1}}
.keyt{border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--surface)}
.keyt .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.keyt .v{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.keyt .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.keyt .s{font-size:12px;color:var(--muted)}
.keyt .s b{color:var(--fg);font-weight:600}
.keyt.st-ok{border-left-color:var(--ok)} .keyt.st-warn{border-left-color:var(--warn)} .keyt.st-crit{border-left-color:var(--crit)}
.keyt.st-acc{border-left-color:var(--accent)} .keyt.st-none{border-left-color:var(--line-strong)}
.keyt.st-none .v{color:var(--muted)}
.keyt.st-sugg{border-left-color:var(--accent);border-left-style:dashed;background:var(--surface-2)}
.pg-h{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);padding:6px 12px;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.prow .pn{font-family:var(--mono);font-size:12.5px;min-width:0;overflow-wrap:break-word}
.prow .pv{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.prow .pv small{font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}
.prow.key{background:var(--accent-soft)}
.pnote{font-size:11.5px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);font-family:var(--mono)}
h3{margin:0;font-size:13px;font-weight:600}
.sect{display:flex;flex-direction:column;gap:8px}
.reftab{width:100%;border-collapse:collapse;font-size:12.5px}.reftab th{font-weight:500;color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line-strong,#ccc)}.reftab th:first-child,.reftab td:first-child{text-align:left}.reftab td{padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--line,#e5e7eb)}.reftab td:first-child{font-family:inherit}.reftab tr.hl td{font-weight:600;background:var(--accent-soft)}.reftab .over{color:#b45309;font-weight:600}
.sect-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.sect-h span{font-size:12px;color:var(--muted);font-family:var(--mono)}
/* Jauge couple réducteur */
.gauge{display:flex;flex-direction:column;gap:8px}
.gi{display:grid;grid-template-columns:minmax(130px,190px) minmax(0,1fr) 120px;grid-template-areas:"gl track gv";gap:4px 12px;align-items:center}
.gi .gl{grid-area:gl} .gi .gv{grid-area:gv} .gi .track,.gi .gscale{grid-area:track}
.gauge .gl{font-size:13px}
.gauge .gv{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.gauge .gv b{font-weight:600}
.track{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:2px}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.crit{background:var(--crit)} .fill.neutral{background:var(--seg-g)}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.track .tick.m{opacity:.3}
.gscale{position:relative;height:14px;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.gscale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media (max-width:560px){.gi{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"gl gv" "track track"}}
/* Alertes */
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r);font-size:13px}
.checks li .tag{font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px}
.checks .crit{background:var(--crit-soft)} .checks .crit .tag{background:var(--crit);color:var(--surface)}
.checks .warn{background:var(--warn-soft)} .checks .warn .tag{background:var(--warn);color:var(--surface)}
.checks .ok{background:var(--ok-soft)} .checks .ok .tag{background:var(--ok);color:var(--surface)}
.checks .info{background:var(--surface-2)} .checks .info .tag{background:var(--line-strong);color:var(--fg)}
/* Détail */
details.calcd{border:1px solid var(--line);border-radius:var(--r)}
details.calcd>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.calcbody{padding:4px 12px 12px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.kv div{font-size:12px;color:var(--muted)} .kv b{display:block;font-family:var(--mono);font-size:14px;color:var(--fg);font-weight:600}
.calc{font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto}
.calc div{white-space:nowrap}
.calc .c{color:var(--muted)}
.ibar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ibar div{height:100%}
.ilegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.ilegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:15px}
.muted{color:var(--muted)}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.sticky{position:static}}
/* Catalogues */
.libbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.libbar .inp{flex:1 1 220px}
.libbar select{font:inherit;font-size:13.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 8px;max-width:100%}
.libgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.libgrid.editing{grid-template-columns:minmax(0,1fr) minmax(0,360px)}
@media (max-width:900px){.libgrid.editing{grid-template-columns:minmax(0,1fr)}.libgrid.editing .edit{order:-1}}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);padding-block:5px}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--accent-soft)}
tbody tr.row.sel td{background:var(--accent-soft)}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;font-family:var(--mono);font-weight:500;color:var(--fg);cursor:pointer;text-align:left}
td.used{color:var(--muted);font-size:12px}
#localbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r);font-size:12px;color:var(--muted)}
#localbar b{color:var(--fg)}
#localbar .grow{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tscroll{overflow-x:auto}
/* Outils par axe */
.toolsbox{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.tool{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tool>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border-radius:var(--r)}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary::before{content:"▸";color:var(--muted);font-size:12px}
.tool[open]>summary::before{content:"▾"}
.tool>summary .tt{flex:1;font-size:13px;font-weight:600}
.tool .tx{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 7px;border-radius:4px}
.tool .tx:hover{color:var(--crit);background:var(--crit-soft)}
.tool .tbody{padding:12px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.step{display:flex;flex-direction:column;gap:8px;min-width:0;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0;padding-bottom:0}
.step .sh{display:flex;align-items:center;gap:8px;font-size:13px}
.step .sn{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sbadge{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.sbadge.none{display:none}.sbadge.ok{background:var(--ok-soft);color:var(--ok)}.sbadge.warn{background:var(--warn-soft);color:var(--warn)}.sbadge.crit{background:var(--crit-soft);color:var(--crit)}
.sform{display:flex;flex-direction:column;gap:8px}.sform:empty{display:none}
.sres{display:flex;flex-direction:column;gap:8px;min-width:0}
.ttab td:nth-child(3){text-align:left;font-family:var(--sans);color:var(--muted);font-size:11.5px}
.tmsg{font-size:12.5px;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-radius:var(--r)}
.tnote{font-size:12.5px;padding:7px 10px;border-radius:var(--r);background:var(--surface-2);color:var(--muted)}
.tnote.crit{background:var(--crit-soft);color:var(--crit)}.tnote.warn{background:var(--warn-soft);color:var(--warn)}
.tact{display:flex;min-width:0}.tact .btn{white-space:normal;text-align:left;height:auto;line-height:1.3}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addtool{border:1px dashed var(--line-strong)!important}
.verdict{font-size:13.5px;font-weight:600;padding:9px 12px;border-radius:var(--r)}.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.ko{background:var(--crit-soft);color:var(--crit)}
.simple{display:flex;flex-direction:column;gap:10px}
.mk{font-weight:700}.mk.ok{color:var(--ok)}.mk.ko{color:var(--crit)}.mk.unk{color:var(--muted)}
.cand td,.cand th{white-space:nowrap}.cand .rbad{color:var(--crit);font-weight:600}.cand .rwarn{color:var(--warn);font-weight:600}
.cand .btn{padding:3px 8px;height:auto;font-size:12px}
.conv{grid-column:1/-1;text-align:right;font-size:11px}
.convbtn{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;font-size:11px;text-decoration:underline dotted;padding:0}
.convbox{display:inline-flex;align-items:center;gap:6px;margin-left:6px}
.convbox[hidden]{display:none}
.convbox input{font-size:12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface-2);color:var(--fg);padding:3px 6px;width:140px;font-family:var(--mono);text-align:right}
</style>
</head>

function inputHtml(f, val, prefix) {
  const id = prefix + f.k;
  const ga = f.g ? ` data-g="${f.g.join(' ')}"` : '';
  const tag = '';
  if (f.t === 'bool') return `<div class="field wide"${ga}><label class="chk"><input type="checkbox" id="${id}" data-k="${f.k}" ${val ? 'checked' : ''}> ${esc(f.l)}${tag}</label></div>`;
  if (f.t === 'area') return `<div class="field wide"><label for="${id}">${esc(f.l)}</label><textarea id="${id}" data-k="${f.k}">${esc(val)}</textarea></div>`;
  let ctrl;
  if (f.t === 'motor' || f.t === 'reducer' || f.t === 'drive') {
    const list = f.t === 'motor' ? S.motors : f.t === 'reducer' ? S.reducers : S.drives;
    const groups = new Map(); list.forEach(x => { const g = x.serie || 'Autres'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(x); });
    const opt = x => `<option value="${esc(x.id)}" ${x.id === val ? 'selected' : ''}>${esc(x.ref)}${f.t === 'reducer' && x.t2b ? ' · T2B ' + esc(x.t2b) + ' Nm' : ''}${f.t === 'drive' && x.iPeak ? ' · ' + esc(x.iPeak) + ' A' : ''}</option>`;
    if (f.t === 'drive') ctrl = `<select id="${id}" data-k="${f.k}"><option value="">— Choisir —</option>${[...groups].map(([g, xs]) => `<optgroup label="${esc(g)}">${xs.map(opt).join('')}</optgroup>`).join('')}</select>`;
    else { const cur = list.find(x => x.id === val);
      ctrl = `<div class="combo" data-combo="${f.t}" data-ck="${f.k}"><div class="inp text"><input id="${id}" class="combo-in" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Taper la référence (ex. ${f.t === 'motor' ? 'SH31004' : 'PLFN 090 i=7'})…" value="${esc(cur ? cur.ref : '')}"><span class="u" aria-hidden="true">▾</span></div><div class="combo-list" role="listbox" hidden></div></div>`; }
    const sel = f.t === 'reducer' && val ? S.reducers.find(x => x.id === val) : null;
    const sum = sel ? `<div class="rsum">Couple max <b>T2B ${sel.t2b != null ? fmt(num(sel.t2b), 0) + ' Nm' : '— (à renseigner)'}</b>${sel.t2n != null ? ' · T2N ' + fmt(num(sel.t2n), 0) + ' Nm' : ''}${sel.t2not != null ? ' · T2Not ' + fmt(num(sel.t2not), 0) + ' Nm' : ''} · i=${fmt(num(sel.ratio), 3)}</div>` : '';
    return `<div class="field wide"${ga}><label for="${id}">${esc(f.l)}${tag}</label>${ctrl}${sum}</div>`;
  }
  if (f.t === 'select') {
    ctrl = `<select id="${id}" data-k="${f.k}">${f.o.map(([v, l]) => `<option value="${v}" ${v === (val || f.o[0][0]) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    return `<div class="field wide"><label for="${id}">${esc(f.l)}</label>${ctrl}</div>`;
  }
  const txt = f.t === 'text';
  ctrl = `<div class="inp ${txt ? 'text' : ''}"><input id="${id}" data-k="${f.k}" ${txt ? '' : 'inputmode="decimal"'} autocomplete="off" value="${esc(val == null ? '' : (txt ? val : String(val).replace('.', ',')))}">${f.u ? `<span class="u">${esc(f.u)}</span>` : ''}</div>`;
  return `<div class="field ${txt ? 'wide' : ''}"${ga}><label for="${id}"><span${f.h ? ` class="hint" title="${esc(f.h)}"` : ''}>${esc(f.l)}</span>${tag}</label>${ctrl}${f.n ? `<div class="fnote">${esc(f.n)}</div>` : ''}${f.conv ? `<div class="conv"><button type="button" class="convbtn" tabindex="-1">saisir en kg·m²</button><span class="convbox" hidden><input class="convin" data-for="${id}" inputmode="decimal" placeholder="valeur en kg·m²" aria-label="Valeur en kg·m², convertie en kg·cm²"><span>kg·m² → ×10 000</span></span></div>` : ''}</div>`;
}
function readInput(el) { if (el.type === 'checkbox') return el.checked; const k = el.dataset.k; return NUM_KEYS.has(k) ? (num(el.value)) : el.value; }

        <div class="ibar" role="img" aria-label="Répartition de l’inertie">${seg(R.Jm, '--seg-m')}${seg(R.Jg, '--seg-g')}${seg(R.JLm, '--seg-l')}</div>
        <div class="ilegend"><span><i style="background:var(--seg-m)"></i>Moteur ${fmt(R.Jm, 2)}</span><span><i style="background:var(--seg-g)"></i>Réducteur ${fmt(R.Jg, 2)}</span><span><i style="background:var(--seg-l)"></i>Charge ramenée au moteur ${fmt(R.JLm, 2)}</span></div>
        <div class="muted" style="font-size:12px;margin-top:6px">Répartition seulement, ce n’est pas une alerte. Rapport d’inertie charge / (moteur + réducteur) : <b style="color:var(--fg)">${fmt(R.ratioTot, 1)}</b>${R.ratioTot != null ? (R.ratioTot > 30 ? ' : très élevé.' : R.ratioTot > 10 ? ' : élevé, monter les gains par petites étapes.' : ' : correct.') : ''}</div></div>
      ${R.gainFactor ? `<div class="muted" style="font-size:12px">Vel_P_Gain transposé : ${fmt(num(S.draft.velPActuel), 2)} × ${fmt(R.gainFactor, 3)} = ${fmt(R.velPTransp, 1)} (inertie déclarée ${fmt(R.Jold, 2)} → ${fmt(R.Jtot, 2)} kg·cm²).</div>` : ''}
      <div class="calc">${R.calc.map(c => `<div>${esc(c[0])} = <b>${fmt(c[1], 4)}</b> ${esc(c[2])} <span class="c">· ${esc(c[3])}</span></div>`).join('')}</div>
      ${infos.length ? `<ul class="checks">${infos.map(c => `<li class="info"><span class="tag">À voir</span><span>${esc(c[1])}</span></li>`).join('')}</ul>` : ''}
    </div></details>
  </div>`;
  linkGauges(); renderToolResults(TT);
  $('#copyP').onclick = async (e) => {
    const txt = `Axe ${S.draft.nom || ''}\n` + P.map(p => `${p[0]} = ${p[1]}`).join('\n');
    try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copié'; setTimeout(() => { e.target.textContent = 'Copier'; }, 1500); }
    catch { e.target.textContent = 'Copie refusée'; }

}

function glow(keys, on) {
  if (!keys) return;
  keys.split(' ').forEach(k => {
    document.querySelectorAll(`#axisForm .field[data-g~="${k}"]`).forEach(el => el.classList.toggle('glow', on));
    document.querySelectorAll(`#results .gi[data-gk="${k}"]`).forEach(el => el.classList.toggle('glow', on));
  });
}
const RANK = { ok: 1, warn: 2, crit: 3 };
function colorFields() {
  document.querySelectorAll('#axisForm .field[data-g]').forEach(f => {
    let worst = null;
    f.dataset.g.split(' ').forEach(k => { const st = S.gstate && S.gstate[k]; if (st && (!worst || RANK[st] > RANK[worst])) worst = st; });
    f.classList.remove('g-ok', 'g-warn', 'g-crit');
    if (worst) f.classList.add('g-' + worst);
    const lab = f.querySelector('label');
    if (lab) lab.title = 'Fait bouger : ' + f.dataset.g.split(' ').map(k => GAUGES[k].l).join(', ');
  });
}
function linkGauges() {
  colorFields();
  document.querySelectorAll('#results .gi[data-gk]').forEach(gi => {
    const k = gi.dataset.gk;
    gi.onmouseenter = gi.onfocus = () => glow(k, true);
    gi.onmouseleave = gi.onblur = () => glow(k, false);
  });
  // la case en cours de saisie garde sa jauge en surbrillance après chaque recalcul
  const f = document.activeElement && document.activeElement.closest && document.activeElement.closest('#axisForm .field[data-g]');
  if (f) glowField(f, true);
}
function glowField(f, on) {
  f.classList.toggle('glow', on);
  f.dataset.g.split(' ').forEach(k => document.querySelectorAll(`#results .gi[data-gk="${k}"]`).forEach(el => el.classList.toggle('glow', on)));
}
/* ---------- Champ moteur / réducteur : taper la référence pour filtrer ---------- */
const norm = t => String(t ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function comboItems(type, q) {
  const list = type === 'motor' ? S.motors : S.reducers;
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return list;
  return list.filter(x => {
    const w = norm([x.ref, x.serie, x.marque].join(' ')).split(/[\s()·]+/).filter(Boolean);
    if (x.ratio != null) { const r = String(num(x.ratio)); w.push(r, r.replace('.', ','), 'i=' + r, 'i=' + r.replace('.', ',')); }
    w.slice().forEach(v => { if (/^0+\d/.test(v)) w.push(v.replace(/^0+/, '')); });
    const pairs = w.slice(0, -1).map((v, n) => v + w[n + 1]);
    const flat = norm(x.ref).replace(/[\s\-_/.,()]/g, '');
    return toks.every(t => t.startsWith('i=') ? (w.includes(t) || w.includes(t.replace(',', '.'))) : (w.some(v => v.startsWith(t)) || pairs.some(v => v.startsWith(t)) || (t.length >= 4 && flat.includes(t))));
  });
}
function comboSub(type, x) {
  return type === 'motor'
    ? [num(x.kt) ?? (num(x.m0) && num(x.i0) ? num(x.m0) / num(x.i0) : null), num(x.imax)].map((v, i) => v == null ? '' : (i ? 'Imax ' + fmt(v, 1) + ' A' : 'Kt ' + fmt(v, 3))).filter(Boolean).join(' · ')
    : ['i=' + fmt(num(x.ratio), 3), x.t2b != null ? 'T2B ' + fmt(num(x.t2b), 0) + ' Nm' : 'T2B ?'].join(' · ');
}
function bindCombos() {
  if (!S.comboDoc) { S.comboDoc = true; document.addEventListener('pointerdown', e => { document.querySelectorAll('.combo').forEach(c => { if (!c.contains(e.target) && c._close) c._close(); }); }); }
  document.querySelectorAll('#axisForm .combo').forEach(box => {
    const type = box.dataset.combo, k = box.dataset.ck, inp = box.querySelector('input'), lst = box.querySelector('.combo-list');
    const list = type === 'motor' ? S.motors : S.reducers;
    const label = () => list.find(x => x.id === S.draft[k])?.ref || '';
    let items = [], act = -1;
    const draw = q => {
      items = comboItems(type, q);
      if (!items.length) { lst.innerHTML = `<div class="cempty">Aucune référence ne correspond. Ajoute-la dans l’onglet ${type === 'motor' ? 'Moteurs' : 'Réducteurs'}.</div>`; act = -1; return; }
      const curId = S.draft[k]; act = Math.max(0, items.findIndex(x => x.id === curId)); if (q) act = 0;
      let h = '', last = null;
      items.forEach((x, n) => { const g = x.serie || 'Autres'; if (g !== last) { h += `<div class="cgrp">${esc(g)}</div>`; last = g; }
        h += `<div class="copt${x.id === curId ? ' cur' : ''}" role="option" id="${inp.id}-o${n}" data-n="${n}" aria-selected="${n === act}"><b>${esc(x.ref)}</b><small>${esc(comboSub(type, x))}</small></div>`; });
      lst.innerHTML = h; mark();
    };
    const mark = () => { lst.querySelectorAll('.copt').forEach(o => o.setAttribute('aria-selected', String(+o.dataset.n === act))); const a = lst.querySelector(`[data-n="${act}"]`); if (a) { inp.setAttribute('aria-activedescendant', a.id); a.scrollIntoView({ block: 'nearest' }); } };
    const open = q => { draw(q); lst.hidden = false; inp.setAttribute('aria-expanded', 'true'); };
    const close = () => { lst.hidden = true; inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant'); };
    const pick = x => { close(); if (!x) { inp.value = label(); return; } if (S.draft[k] !== x.id) { S.draft[k] = x.id; S.dirty = true; S.justSaved = false; renderAxes(); const n = document.getElementById(inp.id); if (n) { S.comboSkip = inp.id; n.focus(); } } else inp.value = label(); };
    inp.addEventListener('focus', () => { inp.select(); if (S.comboSkip === inp.id) { S.comboSkip = null; return; } open(''); });
    inp.addEventListener('click', () => { if (lst.hidden) open(''); });
    inp.addEventListener('input', () => open(inp.value));
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (lst.hidden) open(''); if (items.length) { act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark(); } }
      else if (e.key === 'Enter') { if (!lst.hidden) { e.preventDefault(); pick(items[act]); } }
      else if (e.key === 'Escape') { if (!lst.hidden) { e.preventDefault(); close(); inp.value = label(); } }
      else if (e.key === 'Tab') { close(); inp.value = label(); }
    });
    box._close = () => { if (!lst.hidden) { close(); inp.value = label(); } };
    lst.addEventListener('mousedown', e => { if (e.target.closest('.copt')) e.preventDefault(); });
    lst.addEventListener('click', e => { const o = e.target.closest('.copt'); if (o) pick(items[+o.dataset.n]); });
  });
}
function bindAxes() {
  document.querySelectorAll('[data-axis]').forEach(b => b.onclick = () => {
    if (S.dirty && !b.dataset.force) { b.dataset.force = '1'; setStatus('Modifications non enregistrées : clique à nouveau sur l’axe pour les abandonner.'); return; }
    setStatus(''); S.axisId = b.dataset.axis; S.dirty = false; S.justSaved = false; S.draft = { ...pAxes().find(a => a.id === S.axisId) }; render();
  });
  const nb = $('#newAxis'); if (nb) nb.onclick = () => { S.draft = { _new: true, nom: '', typeCharge: 'lineaire', marge: 80, tStop: 0.2 }; S.dirty = true; S.justSaved = false; render(); };
  const form = $('#axisForm'); if (!form) return;
  bindCombos(); bindTools(form);
  form.addEventListener('focusin', e => { const f = e.target.closest('.field[data-g]'); if (f) glowField(f, true); });
  form.addEventListener('focusout', e => { const f = e.target.closest('.field[data-g]'); if (f) glowField(f, false); });
  form.addEventListener('mouseover', e => { const f = e.target.closest('.field[data-g]'); if (f && !f.contains(e.relatedTarget)) glowField(f, true); });
  form.addEventListener('mouseout', e => { const f = e.target.closest('.field[data-g]'); if (f && !f.contains(e.relatedTarget) && !f.contains(document.activeElement)) glowField(f, false); });
  form.addEventListener('input', e => { const el = e.target; if (!el.dataset.k) return; S.draft[el.dataset.k] = readInput(el); S.dirty = true; S.justSaved = false; updateDirty(); renderResults(); });
  form.addEventListener('change', e => { const el = e.target; if (!el.dataset.k) return; S.draft[el.dataset.k] = readInput(el); S.dirty = true; if (el.dataset.k === 'typeCharge' || el.dataset.k === 'reducteurId') { renderAxes(); const n = document.getElementById(el.id); if (n) n.focus(); } else { updateDirty(); renderResults(); } });
  $('#saveAxis').onclick = async () => {
    const d = { ...S.draft, projetId: S.projId }; const isNew = d._new; delete d._new;
    if (!d.nom) { setStatus('Donne un nom à l’axe avant d’enregistrer.', true); return; }
    const id = isNew ? newId('axes') : d.id; delete d.id;
    try { S.axisId = id; S.dirty = false; S.justSaved = true; S.draft = { id, ...d }; await writeDoc('axes', id, d); setStatus(''); updateDirty(); render(); }
    catch (e) { S.dirty = true; setStatus('Enregistrement impossible : ' + (e.message || e.code), true); }
  };
  const cancel = $('#cancelAxis'); if (cancel) cancel.onclick = () => { S.dirty = false; S.draft = null; onData(); };
  const dup = $('#dupAxis'); if (dup) dup.onclick = () => { const c = { ...S.draft, _new: true, nom: (S.draft.nom || '') + ' (copie)' }; delete c.id; S.draft = c; S.dirty = true; render(); };
  const del = $('#delAxis'); if (del) del.onclick = async () => {
    if (!del.classList.contains('armed')) { del.classList.add('armed', 'danger'); del.textContent = 'Confirmer la suppression'; return; }
    try { const id = S.draft.id; S.draft = null; S.axisId = null; S.dirty = false; await deleteDoc('axes', id); }
    catch (e) { setStatus('Suppression impossible : ' + (e.message || e.code), true); }
  };
}

function renderLib(key) {
  const v = $('#view'); if (!allLoaded()) { v.innerHTML = ''; return; }
  const isM = key === 'motors', FIELDS = isM ? MOTOR_FIELDS : REDUCER_FIELDS, noun = isM ? 'moteur' : 'réducteur';
  const q = (S.search[key] || '').toLowerCase().trim(), ser = S.serie[key] || '';
  const series = [...new Set(S[key].map(x => x.serie || 'Autres'))];
  const list = S[key].filter(x => (!ser || (x.serie || 'Autres') === ser) && (!q || [x.ref, x.serie, x.marque, x.ratio != null ? 'i=' + x.ratio : ''].join(' ').toLowerCase().includes(q)));
  const cols = isM
    ? [['Kt', x => fmt(num(x.kt) ?? (num(x.m0) / num(x.i0)), 3), 'Nm/A'], ['Inertie', x => fmt(num(x.jMotor), 3), 'kg·cm²'], ['Imax', x => fmt(num(x.imax), 1), 'A']]
    : [['i', x => fmt(num(x.ratio), 3), ''], ['T2B', x => fmt(num(x.t2b), 0), 'Nm'], ['J_Gear', x => fmt(num(x.jGear), 3), 'kg·cm²']];
  const used = id => S.axes.filter(a => (isM ? a.moteurId : a.reducteurId) === id).map(a => (projName(a.projetId) ? projName(a.projetId) + ' › ' : '') + a.nom);
  const ed = S.lib[key];
  let body = '', last = null;
  list.forEach(x => {
    const g = x.serie || 'Autres';
    if (g !== last) { body += `<tr class="grp"><td colspan="${cols.length + 2}">${esc(g)}</td></tr>`; last = g; }
    body += `<tr class="row ${ed && ed.id === x.id ? 'sel' : ''}" data-edit="${esc(x.id)}"><td><button class="linkbtn" data-edit="${esc(x.id)}">${esc(x.ref)}</button></td>${cols.map(c => `<td class="n">${c[1](x)}</td>`).join('')}<td class="used">${esc(used(x.id).join(', '))}</td></tr>`;
  });
  const table = list.length ? `<div class="tblwrap"><table><thead><tr><th>Référence</th>${cols.map(c => `<th class="n">${c[0]}${c[2] ? ` <span style="text-transform:none;letter-spacing:0">${c[2]}</span>` : ''}</th>`).join('')}<th>Utilisé par</th></tr></thead><tbody>${body}</tbody></table></div>`
    : `<div class="empty"><b>Aucun résultat</b><span>${q || ser ? 'Rien ne correspond à ce filtre.' : 'Clique sur « + Ajouter » pour créer le premier ' + noun + '.'}</span></div>`;
  const form = ed ? `<section class="panel edit sticky"><div class="panel-h"><h2>${ed.id ? esc(ed.ref || '') : 'Nouveau ' + noun}</h2><button class="btn ghost" id="libCancel">Fermer</button></div>
    <div class="panel-b" id="libForm"><fieldset>${FIELDS.map(f => inputHtml(f, ed[f.k], 'lib-')).join('')}</fieldset>
    <div class="actions"><button class="btn primary" id="libSave">${ed.id ? 'Enregistrer' : 'Ajouter'}</button>${ed.id ? `<button class="btn ghost" id="libDup">Dupliquer</button>${ed._cat ? '' : `<button class="btn ghost ${S.confirm === ed.id ? 'danger armed' : ''}" id="libDel">${S.confirm === ed.id ? 'Confirmer la suppression' : 'Supprimer'}</button>`}` : ''}</div></div></section>` : '';
  v.innerHTML = `<div class="panel" style="padding:10px 12px"><div class="libbar"><div class="inp text"><input id="libSearch" placeholder="Rechercher : référence, i=7…" value="${esc(S.search[key])}" autocomplete="off"></div>
      <select id="libSerie" aria-label="Série"><option value="">Toutes les séries (${S[key].length})</option>${series.map(g => `<option ${g === ser ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
      <button class="btn primary" id="libNew">+ Ajouter</button></div></div>
    <div class="libgrid ${ed ? 'editing' : ''}" style="margin-top:14px"><section class="panel">${table}</section>${form}</div>`;
  const ls = $('#libSearch'); ls.oninput = () => { S.search[key] = ls.value; const pos = ls.selectionStart; render(); const n = $('#libSearch'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
  $('#libSerie').onchange = e => { S.serie[key] = e.target.value; render(); };
  $('#libNew').onclick = () => { S.lib[key] = {}; S.confirm = null; render(); };
  v.querySelectorAll('tr[data-edit]').forEach(b => b.onclick = () => { S.lib[key] = { ...S[key].find(x => x.id === b.dataset.edit) }; S.confirm = null; render(); });
  if (!ed) return;
  const lf = $('#libForm');
  const sync = e => { const el = e.target; if (!el.dataset.k) return; S.lib[key] = { ...(S.lib[key] || {}), [el.dataset.k]: readInput(el) }; };
  lf.addEventListener('input', sync); lf.addEventListener('change', sync);
  $('#libCancel').onclick = () => { S.lib[key] = null; S.confirm = null; render(); };
  $('#libSave').onclick = async () => {
    const d = { ...(S.lib[key] || {}) };
    if (!d.ref) { setStatus('La référence est obligatoire.', true); return; }
    if (!isM && !num(d.ratio)) { setStatus('Le rapport de réduction est obligatoire.', true); return; }
    const id = d.id || newId(key); delete d.id;
    try { await writeDoc(key, id, d); S.lib[key] = null; setStatus(''); render(); } catch (e) { setStatus('Enregistrement impossible : ' + (e.message || e.code), true); }
  };
  const dup = $('#libDup'); if (dup) dup.onclick = () => { const c = { ...S.lib[key], ref: (S.lib[key].ref || '') + ' (copie)' }; delete c.id; S.lib[key] = c; S.confirm = null; render(); };
  const del = $('#libDel'); if (del) del.onclick = async () => {
    const id = ed.id, u = used(id);

    S.confirm = null; try { await deleteDoc(key, id); S.lib[key] = null; setStatus(''); render(); } catch (e) { setStatus('Suppression impossible : ' + (e.message || e.code), true); }
  };
}

(async () => {

  S.db = db;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { S.dl = d || null; if (d) render(); }).catch(() => {});
  if (!db) {
    let base = null, seed = null, added = 0;
    try { base = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) {}
    try { seed = JSON.parse(document.getElementById('seed')?.textContent || 'null'); } catch (e) {}
    if (!base) { loadBase(seed); S.seedVersion = seed?._version || null; S.seedHashes = seed ? seedHashesOf(seed) : null; if (seed) saveLocal(); }
    else {
      loadBase(base); S.seedVersion = base._seedVersion || null; S.seedHashes = base._seedHashes || null;
      // Nouvelle version du fichier : ajoute les moteurs/réducteurs/variateurs du catalogue absents de la base locale (sans toucher à tes modifications)
      if (seed?._version && seed._version !== S.seedVersion) syncSeed(seed, false);
    }
    const info = () => { const el = $('#seedInfo'); if (el) el.textContent = 'Catalogue ' + (S.seedVersion || '—') + ' · ' + S.reducers.filter(x => !x._cat).length + ' réducteurs'; };
    S.seedInfo = info; info();
    $('#updCat').onclick = () => { if (!seed) { setStatus('Pas de catalogue dans ce fichier.', true); return; } syncSeed(seed, true); render(); };
    $('#expBase').onclick = () => {
      const blob = new Blob([JSON.stringify(Object.fromEntries(KEYS.map(k => [k, S[k]])), null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'base-reglages-servo-' + new Date().toISOString().slice(0, 10) + '.json';

    };
    $('#impBase').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      try { const o = JSON.parse(await f.text()); if (!KEYS.some(k => Array.isArray(o[k]))) throw new Error('fichier non reconnu');
        loadBase(o); S.projId = null; S.axisId = null; S.draft = null; S.dirty = false; saveLocal(); setStatus('Base importée : ' + S.motors.length + ' moteurs, ' + S.reducers.length + ' réducteurs, ' + S.axes.length + ' axes.'); onData(); }
      catch (err) { setStatus('Import impossible : ' + err.message, true); }
    };
    onData(); return;
  }
  KEYS.forEach(key => {
    db.collection(COLL[key]).onSnapshot(snap => { S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded[key] = true; onData(); },
      e => setStatus('Lecture de la base impossible (' + e.code + ').', true));
  });
})();
